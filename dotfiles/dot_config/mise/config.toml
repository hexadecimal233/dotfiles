[tools]
node = "26"
# "cargo:https://github.com/oxalica/nil" = { version = "tag:2026-07-23", crate = "nil" }
"cargo:inferno" = "latest"
opencode = "latest"
bun = "latest"
rust = "latest"
java = "zulu-javafx-25.36.205.0"
rust-analyzer = "latest"
"npm:tokscale" = "latest"
pnpm = "latest"
pi = "latest"
uv = "latest"
ruby = "latest"
"npm:backlog.md" = "latest"
dotnet = "10"
go = "latest"
"npm:skills" = "latest"
zig = "latest"
"npm:degit" = "latest"
"npm:quicktype" = "latest"
"pipx:pyclip" = "latest"
"pipx:copyparty" = "latest"
"pipx:icpquery" = "latest"
"go:golang.org/x/tools/gopls" = "latest"
julia = { version = "1", checksum_expr = '"sha256:" + filter(fromJSON(body)[version + ""].files, { #.url == url })[0].sha256', checksum_url = "https://julialang-s3.julialang.org/bin/versions.json", version_expr = 'sortVersions(filter(keys(fromJSON(body)), { # matches "^\\d+\\.\\d+\\.\\d+(-[0-9A-Za-z\\.-]+)?$" }))', version_list_url = "https://julialang-s3.julialang.org/bin/versions.json", platforms = { macos-x64 = { url = """{% if version == "nightly" %}https://julialangnightlies-s3.julialang.org/bin/mac/x64/julia-latest-mac64.tar.gz{% else %}https://julialang-s3.julialang.org/bin/mac/x64/{{ (version | split(pat='.'))[0:2] | join(sep='.') }}/julia-{{ version }}-mac64.tar.gz{% endif %}""" }, macos-arm64 = { url = """{% if version == "nightly" %}https://julialangnightlies-s3.julialang.org/bin/mac/aarch64/julia-latest-macaarch64.tar.gz{% else %}https://julialang-s3.julialang.org/bin/mac/aarch64/{{ (version | split(pat='.'))[0:2] | join(sep='.') }}/julia-{{ version }}-macaarch64.tar.gz{% endif %}""" }, linux-x64 = { url = """{% if version == "nightly" %}https://julialangnightlies-s3.julialang.org/bin/linux/x64/julia-latest-linux64.tar.gz{% else %}https://julialang-s3.julialang.org/bin/linux/x64/{{ (version | split(pat='.'))[0:2] | join(sep='.') }}/julia-{{ version }}-linux-x86_64.tar.gz{% endif %}""" }, linux-arm64 = { url = """{% if version == "nightly" %}https://julialangnightlies-s3.julialang.org/bin/linux/aarch64/julia-latest-linuxaarch64.tar.gz{% else %}https://julialang-s3.julialang.org/bin/linux/aarch64/{{ (version | split(pat='.'))[0:2] | join(sep='.') }}/julia-{{ version }}-linux-aarch64.tar.gz{% endif %}""" }, windows-x64 = { format = "zip", url = """{% if version == "nightly" %}https://julialangnightlies-s3.julialang.org/bin/winnt/x64/julia-latest-win64.zip{% else %}https://julialang-s3.julialang.org/bin/winnt/x64/{{ (version | split(pat='.'))[0:2] | join(sep='.') }}/julia-{{ version }}-win64.zip{% endif %}""" } } }

[env]
DOTNET_CLI_TELEMETRY_OPTOUT = "1"
OMO_DISABLE_POSTHOG = "1"
OMO_SEND_ANONYMOUS_TELEMETRY = "0"
WRANGLER_SEND_METRICS = "false"
ASTRO_TELEMETRY_DISABLED = "1"
EDITOR = "hx"
CARAPACE_MATCH = "CASE_INSENSITIVE"
_.path = [
  "{{env.HOME}}/.local/bin",
  "{{env.HOME}}/.bun/bin",
  "{{env.HOME}}/.local/share/pnpm/bin",
  "{{env.HOME}}/Library/pnpm/bin",  # macos pnpm
  "{{env.HOME}}/.cargo/bin",
  "{{env.HOME}}/go/bin",
]

# only on nixos?? https://github.com/cloudflare/workers-sdk/issues/8158, fix workerd untrusted certificate
# NODE_EXTRA_CA_CERTS = "/etc/ssl/certs/ca-certificates.crt"

[settings]
idiomatic_version_file_enable_tools = [
  # "elixir",
  # "go",
  # "java",
  # "node",
  # "python",
  "rust",  # mise hard overrides rust version file so we replace here
  # "yarn",
]
